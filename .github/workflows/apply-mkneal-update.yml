name: Apply MK NEAL site update

on:
  push:
    paths:
      - ".github/workflows/apply-mkneal-update.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
      - name: Apply requested edits
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("index.html")
          s = p.read_text()
          s = s.replace('"title": "Open Mike"', '"title": "Mouv Radio"')
          s = s.replace('"title": "Our Turn"', '"title": "Jordan Brand"')
          s = s.replace(
              '"venue": "Le Rouge Pigalle",\n      "date": "3 avril 2026"',
              '"venue": "Le Rouge Pigalle",\n      "url": "https://www.instagram.com/lerougepigalleparis",\n      "date": "3 avril 2026"'
          )
          old = "const info=document.createElement('p');info.className='event-meta';info.textContent=event.venue+(event.date?' · '+event.date:'');"
          new = "const info=document.createElement('p');info.className='event-meta';if(event.url){const venueLink=document.createElement('a');venueLink.href=event.url;venueLink.target='_blank';venueLink.rel='noopener noreferrer';venueLink.textContent=event.venue;info.append(venueLink,event.date?' · '+event.date:'');}else{info.textContent=event.venue+(event.date?' · '+event.date:'');}"
          if old not in s:
              raise SystemExit("Expected event-meta renderer not found")
          s = s.replace(old, new)
          p.write_text(s)
          PY
      - name: Remove temporary workflow and commit
        shell: bash
        run: |
          rm -f .github/workflows/apply-mkneal-update.yml
          git config user.name "MK NEAL Site Updater"
          git config user.email "actions@users.noreply.github.com"
          git add index.html .github/workflows/apply-mkneal-update.yml
          git commit -m "Update globe labels and Rouge Pigalle link"
          git push
